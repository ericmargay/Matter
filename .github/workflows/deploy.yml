name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # para republicar sin tener que hacer un commit

# Un solo despliegue a la vez; si se encolan dos, gana el último.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Compilar
        env:
          # El sitio cuelga de /<repo>/ en Pages, no de la raíz del dominio.
          BASE_PATH: /${{ github.event.repository.name }}/
          # El panel de operaciones lleva costos y márgenes: no se publica.
          # Para incluirlo en un despliegue privado, cambiar a "on".
          VITE_ADMIN: 'off'
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
